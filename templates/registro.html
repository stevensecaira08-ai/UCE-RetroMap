<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCE Retro Campus - Acceso</title>
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b132b;
            background-image: url("{{ url_for('static', filename='fondo_campus.png') }}");
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .uce-logo {
            display: block;
            margin: 0 auto 15px auto;
            width: 130px; 
            image-rendering: pixelated;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.8));
        }

        .game-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, #ffea00 0%, #ff7b00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(4px 4px 0px #000000);
            line-height: 1.2;
        }

        .subtitle {
            text-align: center;
            font-size: 0.6rem;
            color: #ebe1dd;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .login-panel {
            background-color: #0a1128; 
            border: 6px solid #1c2541;
            border-radius: 15px;
            padding: 2.5rem;
            width: 420px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.8), inset 0px 0px 10px rgba(0, 255, 255, 0.1);
            color: #8da9c4;
            position: relative;
            z-index: 10;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .custom-input {
            background-color: #1c2541 !important;
            color: #ffffff !important;
            border: 2px solid #3a506b !important;
            font-size: 0.7rem !important;
            padding: 12px !important;
        }

        .custom-input::placeholder { color: #5bc0be; }

        .input-label {
            color: #5bc0be;
            font-size: 0.7rem;
            margin-bottom: 5px;
            display: block;
        }

        .btn-start {
            background-color: #ffb703;
            color: #023047;
            border: 4px solid #eeeeee;
            width: 100%;
            padding: 15px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #eee;
        }

        .map-marker {
            position: absolute;
            background-color: #0b132b;
            color: white;
            border: 3px solid #5bc0be;
            padding: 8px 12px;
            font-size: 0.6rem;
            border-radius: 5px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.7);
            cursor: pointer;
            animation: float-marker 3s ease-in-out infinite;
            transition: all 0.2s ease-in-out; 
            z-index: 5;
        }

        .map-marker:hover {
            background-color: #1c2541; 
            border-color: #ffb703; 
            color: #ffb703; 
            transform: scale(1.15); 
            box-shadow: 0 0 15px 5px rgba(91, 192, 190, 0.8), 0 0 30px rgba(255, 183, 3, 0.6);
            animation-play-state: paused; 
            z-index: 100;
        }

        @keyframes float-marker {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        .marker-1 { top: 20%; left: 15%; animation-delay: 0s; }
        .marker-2 { top: 40%; left: 25%; animation-delay: 0.5s; }
        .marker-3 { top: 60%; left: 10%; animation-delay: 1s; }
        .marker-4 { top: 15%; right: 20%; animation-delay: 0.2s; }
        .marker-5 { top: 45%; right: 15%; animation-delay: 0.75s; }

        .bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #0a1128;
            border-top: 4px solid #1c2541;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-sizing: border-box;
        }

        .exp-bar-container {
            width: 300px;
            background: #000;
            border: 2px solid #5bc0be;
            height: 15px;
            position: relative;
        }

        .exp-bar-fill {
            background: #ffb703;
            width: 15%; 
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE MÚSICA DE FONDO (OCULTO) -->
    <audio id="bg-music" autoplay loop>
        <source src="{{ url_for('static', filename='musica_menu.mp3') }}" type="audio/mpeg">
    </audio>

    <div class="map-marker marker-1">BIBLIOTECA</div>
    <div class="map-marker marker-2">CANCHAS</div>
    <div class="map-marker marker-3">AULAS</div>
    <div class="map-marker marker-4">RECTORADO</div>
    <div class="map-marker marker-5">CAFETERÍA</div>

    <div class="login-panel">
        <img src="{{ url_for('static', filename='logo_uce.png') }}" alt="Escudo Universidad Central del Ecuador" class="uce-logo">
        <div class="game-title">ACCESO<br>UCE</div>
        <p class="subtitle">> Explora tu campus, <br>vive la experiencia UCE!</p>

        <form action="/" method="POST">
            <div style="margin-bottom: 1.2rem;">
                <label class="input-label" for="username">USUARIO</label>
                <input type="text" id="username" name="username" class="nes-input custom-input" placeholder="Tu nick..." required>
            </div>
            <div style="margin-bottom: 1.2rem;">
                <label class="input-label" for="email">CORREO INSTITUCIONAL</label>
                <input type="email" id="email" name="email" class="nes-input custom-input" placeholder="@uce.edu.ec" required>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label class="input-label" for="password">CONTRASEÑA</label>
                <input type="password" id="password" name="password" class="nes-input custom-input" placeholder="******" required>
            </div>
            <button type="submit" class="btn-start">▶ START GAME!</button>
        </form>
    </div>

    <div class="bottom-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <i class="nes-icon star is-medium"></i>
            <div>
                <div style="color: #5bc0be; font-size: 0.8rem; margin-bottom: 5px;">BIENVENIDO A LA UCE</div>
                <div style="font-size: 0.5rem; color: #8da9c4;">Aprende, explora y construye tu futuro.</div>
            </div>
        </div>
        <div>
            <div style="font-size: 0.6rem; color: #ffb703; margin-bottom: 5px; text-align: right;">NIVEL 1</div>
            <div class="exp-bar-container">
                <div class="exp-bar-fill"></div>
                <div style="position: absolute; top: 2px; left: 0; width: 100%; text-align: center; font-size: 0.5rem; color: #fff;">15/100 EXP</div>
            </div>
        </div>
    </div>

    <!-- SCRIPT PARA FORZAR LA MÚSICA AL HACER CLIC -->
    <script>
        document.body.addEventListener('click', function() {
            const music = document.getElementById('bg-music');
            if (music.paused) {
                music.play();
            }
        }, { once: true }); // Solo se ejecuta en el primer clic
    </script>
</body>
</html>
